{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <form method="post" class="card p-4">
      <h1 class="h4 mb-3">Create an account</h1>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="full_name">Full name</label>
          <input class="form-control" id="full_name" name="full_name" value="{{ form.full_name }}" required maxlength="100">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" value="{{ form.username }}" required maxlength="50">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="phone">Phone</label>
          <input class="form-control" id="phone" name="phone" value="{{ form.phone }}" required
                 placeholder="05XXXXXXXXX" pattern="\+?[0-9 ]{10,18}">
        </div>
        <div class="col-12">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control" id="email" name="email" type="email" value="{{ form.email }}" required maxlength="100">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required minlength="6">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="password2">Repeat password</label>
          <input class="form-control" id="password2" name="password2" type="password" required minlength="6">
        </div>
      </div>
      <button class="btn btn-accent w-100 mt-4">Sign up</button>
      <p class="small text-secondary mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
  </div>
</div>
{% endblock %}
