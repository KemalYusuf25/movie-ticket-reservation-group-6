{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <form method="post" class="card p-4">
      <h1 class="h4 mb-3">Log in</h1>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-accent w-100">Log in</button>
      <p class="small text-secondary mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </form>
  </div>
</div>
{% endblock %}
