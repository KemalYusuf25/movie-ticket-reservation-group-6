{% extends "base.html" %}
{% block title %}Admin · Cinema{% endblock %}
{% block content %}
{% set active = 'admin_cinemas' %}{% include "admin/_nav.html" %}
{% set c = cinema or {} %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <form method="post" class="card p-4">
      <h1 class="h4 mb-3">{{ 'Edit cinema' if c.cinema_id else 'Add cinema' }}</h1>
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" value="{{ c.name or '' }}" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label" for="city">City</label>
        <input class="form-control" id="city" name="city" value="{{ c.city or '' }}" required maxlength="50">
      </div>
      <div class="mb-3">
        <label class="form-label" for="address">Address <span class="text-secondary">(optional)</span></label>
        <textarea class="form-control" id="address" name="address" rows="2" maxlength="200">{{ c.address or '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-accent">Save</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('admin_cinemas') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
